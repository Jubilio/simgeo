services:
  db:
    image: postgis/postgis:15-3.3
    container_name: simgeo_postgis
    environment:
      - POSTGRES_DB=simgeo
      - POSTGRES_USER=simgeo_user
      - POSTGRES_PASSWORD=simgeo_pass
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: simgeo_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: simgeo_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@simgeo.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

  api:
    build: .
    container_name: simgeo_api
    command: /app/entrypoint.sh
    volumes:
      - .:/app
      - ~/.config/earthengine:/root/.config/earthengine:ro
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=simgeo
      - DB_USER=simgeo_user
      - DB_PASSWORD=simgeo_pass
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgis_data:
