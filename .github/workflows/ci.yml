name: SimGeo CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scientific-registry:
    name: Scientific registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate scientific module registry
        run: python scripts/validate_scientific_specs.py
      - name: Test registry validator
        run: python -m unittest scripts.tests.test_validate_scientific_specs

  backend:
    name: Django backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: simgeo
          POSTGRES_USER: simgeo_user
          POSTGRES_PASSWORD: simgeo_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simgeo_user -d simgeo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: simgeo
      DB_USER: simgeo_user
      DB_PASSWORD: simgeo_pass
      REDIS_URL: redis://127.0.0.1:6379/1
      SECRET_KEY: ci-only-not-for-production
      DEBUG: "False"
      GOOGLE_FLOOD_API_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - name: Install GIS system libraries
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Django tests
        run: python manage.py test

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
